<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>New Tab - Canopy</title>
  <link rel="stylesheet" href="newtab.css">
</head>
<body>
  <div id="app">
    <header id="header">
      <h1>Canopy</h1>
      <div id="controls">
        <button id="btn-reset" title="Reset view">Reset</button>
        <button id="btn-fit" title="Fit to view">Fit</button>
        <button id="btn-clear" title="Clear all history data">Clear</button>
      </div>
    </header>
    <main id="canvas-container">
      <canvas id="tree-canvas"></canvas>
      <div id="zoom-controls">
        <button id="btn-zoom-in" title="Zoom in">+</button>
        <button id="btn-zoom-out" title="Zoom out">−</button>
      </div>
    </main>
    <div id="tooltip" class="hidden"></div>
  </div>
  <script type="module" src="newtab.js"></script>
</body>
</html>
